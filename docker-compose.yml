services:
  backend_api:
    build:
      context: ./apps/backend_api
      dockerfile: Dockerfile
    container_name: segury_backend_api
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      PROJECT_ROOT: /workspace
      FRONTEND_LEGACY_DIR: /workspace/apps/frontend_legacy
      DATA_DIR: /workspace/data
    volumes:
      - ./apps/backend_api:/app
      - ./apps/frontend_legacy:/workspace/apps/frontend_legacy
      - ./data:/workspace/data
    depends_on:
      - postgres_postgis
      - redis
    restart: unless-stopped

  frontend_web:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: segury_frontend_web
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend_api
    restart: unless-stopped

  postgres_postgis:
    image: postgis/postgis:15-3.4
    container_name: segury_postgres_postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-segurytech}
      POSTGRES_USER: ${POSTGRES_USER:-segury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-segury123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: segury_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: segury_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@segurytech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres_postgis
    restart: unless-stopped

volumes:
  postgres_postgis_data: